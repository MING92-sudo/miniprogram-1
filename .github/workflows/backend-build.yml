name: Backend Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maintenance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: maintenance
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_JWT_SECRET: ci-only-secret-key-with-32-characters-min
      APP_FILE_ROOT: /tmp/maintenance-files
      DB_SEED_DEMO: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test backend
        run: mvn -s backend/settings.xml -f backend/pom.xml test
