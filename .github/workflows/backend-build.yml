name: Backend Build

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maintenance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: maintenance
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: ci-only-secret-key-with-32-characters-min
      FILE_STORAGE_DIR: /tmp/maintenance-files
      SEED_DEMO_DATA: false
      # 打开 Flyway 与 Spring 上下文的集成测试：该测试自带 jwt/wx/seed 覆盖，
      # 只认这三个 P0_TEST_MYSQL_* 变量。缺它们则整类静默跳过，CI 变成纯单测跑。
      P0_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/maintenance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
      P0_TEST_MYSQL_USER: root
      P0_TEST_MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test backend
        run: mvn -s backend/settings.xml -f backend/pom.xml test
