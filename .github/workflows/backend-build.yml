name: Backend Build

on:
  pull_request:
  push:
    # master 为人工开发主干；codex/** 为 AI 协作分支（AGENTS §5），推送即跑后端构建与单测
    branches: [master, "codex/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maintenance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: maintenance
      DB_USERNAME: root
      DB_PASSWORD: root
      # CI 专用占位值（仅用于让上下文启动/单测通过）：严禁在任何真实环境复用；生产走云托管环境变量（AGENTS §2.1）
      JWT_SECRET: ci-only-secret-key-with-32-characters-min
      APP_FILE_ROOT: /tmp/maintenance-files
      SEED_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test backend
        run: mvn -s backend/settings.xml -f backend/pom.xml test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regression scripts (dispatch / templates / handover-template / login-flow / report-recovery / config-examples / location-auth)
        run: |
          node scripts/verify-dispatch.js
          node scripts/verify-templates.js
          node scripts/verify-handover-template.js
          node scripts/verify-login-flow.js
          node scripts/verify-report-recovery.js
          node scripts/verify-config-examples.js
          node scripts/verify-location-auth.js
      - name: Root lint (mini-program)
        run: |
          npm ci --no-audit --no-fund
          npm run lint
      - name: Admin lint / test / build
        working-directory: admin
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build

  # 真实 MySQL 集成套件（事务回滚/并发/幂等租约）：独立 job 与 build 并行，不拉长 PR 级门禁墙钟
  integration-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ARCHIVE_IT_MYSQL_SERVER_URL: jdbc:mysql://127.0.0.1:3306/
      ARCHIVE_IT_MYSQL_USERNAME: root
      ARCHIVE_IT_MYSQL_PASSWORD: root
      DISPATCH_IT_MYSQL_SERVER_URL: jdbc:mysql://127.0.0.1:3306/
      DISPATCH_IT_MYSQL_USERNAME: root
      DISPATCH_IT_MYSQL_PASSWORD: root
      IDEMPOTENCY_IT_MYSQL_SERVER_URL: jdbc:mysql://127.0.0.1:3306/
      IDEMPOTENCY_IT_MYSQL_USERNAME: root
      IDEMPOTENCY_IT_MYSQL_PASSWORD: root
      LIFECYCLE_IT_MYSQL_SERVER_URL: jdbc:mysql://127.0.0.1:3306/
      LIFECYCLE_IT_MYSQL_USERNAME: root
      LIFECYCLE_IT_MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Integration tests (real MySQL)
        run: mvn -s backend/settings.xml -f backend/pom.xml "-Dtest=*IntegrationTest" "-Dsurefire.failIfNoSpecifiedTests=false" test
