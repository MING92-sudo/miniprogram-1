server:
  # 云托管容器监听端口约定 80；本地开发默认 8080，部署容器时在 Dockerfile 设置 SERVER_PORT=80
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: maintenance-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:maintenance}?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

platform:
  # 以下凭证一律由环境变量 / .env 注入，禁止写真实值入库
  auth-login-url: ${REG_AUTH_LOGIN_URL:}
  api-base-url: ${REG_API_BASE_URL:}
  username: ${REG_USERNAME:}
  key: ${REG_KEY:}
  appcode: ${REG_APPCODE:}
  secret: ${REG_SECRET:}
  retry-auto: ${REG_RETRY_AUTO:false}
  legacy-upload-enabled: ${REG_LEGACY_UPLOAD_ENABLED:false}

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-before-production-32-bytes-minimum!}
    ttl-hours: ${APP_JWT_TTL_HOURS:12}
  file-root: ${APP_FILE_ROOT:./data/files}
  work-duration-minutes: ${APP_WORK_DURATION_MINUTES:30}

logging:
  level:
    com.cqwlw.maintenance: DEBUG
