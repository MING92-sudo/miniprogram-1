server:
  # 云托管容器监听端口约定 80；本地开发默认 8080，部署容器时在 Dockerfile 设置 SERVER_PORT=80
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: maintenance-backend
  # Java 侧 .env 加载（与 scripts 共用根目录 .env；凭证只存在于本地 .env / 云托管环境变量）
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    # Connector/J 8：characterEncoding=UTF-8 即自动映射 MySQL utf8mb4
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:maintenance}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

platform:
  # 以下凭证一律由环境变量 / .env 注入，禁止写真实值入库
  auth-login-url: ${REG_AUTH_LOGIN_URL:}
  api-base-url: ${REG_API_BASE_URL:}
  username: ${REG_USERNAME:}
  key: ${REG_KEY:}
  appcode: ${REG_APPCODE:}
  secret: ${REG_SECRET:}
  retry-auto: ${REG_RETRY_AUTO:false}
  legacy-upload-enabled: ${REG_LEGACY_UPLOAD_ENABLED:false}

logging:
  level:
    com.cqwlw.maintenance: DEBUG

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 自建应用配置（全部环境变量注入，禁止真实凭证入库）
app:
  # JWT 签名密钥：生产必须注入强随机 JWT_SECRET
  # 默认值仅保证容器能启动（jjwt 要求 ≥32 字节）；生产必须注入强随机 JWT_SECRET/APP_JWT_SECRET
  jwt-secret: ${JWT_SECRET:${APP_JWT_SECRET:dev-only-secret-change-me-32bytes-minimum-0123456789}}
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:72}
  # 云托管免鉴权注入 X-WX-OPENID；本地开发无该头时用 dev_openid 兜底
  dev-openid: ${DEV_OPENID:dev_openid}
  # 演示种子数据（生产置 false）
  seed-demo-data: ${SEED_DEMO_DATA:${DB_SEED_DEMO:true}}
  # 文件存储：配置 COS_* 时走 COS 代理上传，否则回退本地磁盘（仅开发用）
  cos-secret-id: ${COS_SECRET_ID:}
  cos-secret-key: ${COS_SECRET_KEY:}
  cos-region: ${COS_REGION:}
  cos-bucket: ${COS_BUCKET:}
  file-storage-dir: ${FILE_STORAGE_DIR:${APP_FILE_ROOT:./data/files}}
  # LBS 逆地址解析 key（前端不接触 key，docs/08 审查 #5）
  lbs-amap-key: ${LBS_AMAP_KEY:}
  lbs-tencent-key: ${LBS_TENCENT_KEY:}
