server:
  # 云托管容器监听端口约定 80；本地开发默认 8080，部署容器时在 Dockerfile 设置 SERVER_PORT=80
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: maintenance-backend
  # Java 侧 .env 加载（与 scripts 共用根目录 .env；凭证只存在于本地 .env / 云托管环境变量）
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    # Connector/J 8：characterEncoding=UTF-8 即自动映射 MySQL utf8mb4
    # createDatabaseIfNotExist=true：目标库不存在时由驱动自动建库（需账号对该库有 CREATE 权限），
    # 避免"删库后忘记重建"导致 Hikari 连接失败、容器启动失败（2026-10-01 云托管首部署踩坑）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:maintenance}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

platform:
  # 以下凭证一律由环境变量 / .env 注入，禁止写真实值入库
  auth-login-url: ${REG_AUTH_LOGIN_URL:}
  api-base-url: ${REG_API_BASE_URL:}
  username: ${REG_USERNAME:}
  key: ${REG_KEY:}
  appcode: ${REG_APPCODE:}
  secret: ${REG_SECRET:}
  legacy-upload-enabled: ${REG_LEGACY_UPLOAD_ENABLED:false}

logging:
  level:
    com.cqwlw.maintenance: INFO # Minor2：生产默认 INFO，本地调试临时改回

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 自建应用配置（全部环境变量注入，禁止真实凭证入库）
app:
  # JWT 签名密钥：生产必须注入强随机 JWT_SECRET
  # 默认值仅保证容器能启动（jjwt 要求 ≥32 字节）；生产必须注入强随机 JWT_SECRET/APP_JWT_SECRET
  jwt-secret: ${JWT_SECRET:${APP_JWT_SECRET:dev-only-secret-change-me-32bytes-minimum-0123456789}}
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:72}
  # 云托管免鉴权注入 X-WX-OPENID；本地开发无该头时用 dev_openid 兜底
  dev-openid: ${DEV_OPENID:dev_openid}
  # 演示种子数据（生产置 false）
  # C5：默认关闭——生产首启不得自动写入弱口令账号与假电梯（虚假数据风险）
  seed-demo-data: ${SEED_DEMO_DATA:${DB_SEED_DEMO:false}}
  # 作业时长下限（分钟，签到→签退；业主补充规则，上线前待业务/合规确认）。测试跑通签退流程可临时置 0/1。
  work-duration-minutes: ${APP_WORK_DURATION_MINUTES:30}
  # 签到定位阈值全局默认（米）：电梯级 elevator.checkin_threshold 优先；坐标未登记则不拦截只留痕（docs/02 §5.4）
  checkin-threshold-meters: ${APP_CHECKIN_THRESHOLD_METERS:200}
  # 文件存储：配置 COS_BUCKET/COS_REGION 即走 COS 代理上传，否则回退本地磁盘（仅开发用）。
  # 桶名/地域非凭证，可直接入库（微信云托管控制台-对象存储-存储配置）；
  # 云托管托管桶无静态密钥，走内网临时凭证 COS_AUTH_URL（/_/cos/getauth），
  # 仅自建 COS 桶（本地联调）才注入 COS_SECRET_ID/COS_SECRET_KEY。
  cos-secret-id: ${COS_SECRET_ID:}
  cos-secret-key: ${COS_SECRET_KEY:}
  cos-region: ${COS_REGION:ap-shanghai}
  cos-bucket: ${COS_BUCKET:7072-prod-d3gg6nba2f3160af9-1498557567}
  cos-auth-url: ${COS_AUTH_URL:http://api.weixin.qq.com/_/cos/getauth}
  file-storage-dir: ${FILE_STORAGE_DIR:${APP_FILE_ROOT:./data/files}}
  # M8：配置后文件 URL 用该地址拼装（未配置沿用请求 Host，反向代理子路径部署建议配置）
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  # LBS 逆地址解析 key（前端不接触 key，docs/08 审查 #5）
  lbs-amap-key: ${LBS_AMAP_KEY:}
  lbs-tencent-key: ${LBS_TENCENT_KEY:}
